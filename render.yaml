services:
  - type: web
    name: anwar-kpiflow
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: ANTHROPIC_API_KEY
        sync: false
      # Postgres (Supabase project: anwar-kpiflow, ap-south-1). Use the
      # TRANSACTION pooler connection string (port 6543), not the session
      # pooler (5432) — this app's queries fan out concurrently, and session
      # mode exhausts the free tier's small shared connection pool fast.
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        value: https://gpvuaivlzwbgrjivfmcm.supabase.co
      # service_role secret key — server-side only, used to read/write the
      # private "evidence" storage bucket. Never expose this to the browser.
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
